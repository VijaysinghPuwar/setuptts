name: Build Release

# Triggers:
#   - Push of a version tag:  git tag v1.6.0 && git push origin v1.6.0
#     The tag must match APP_VERSION in app/__init__.py, and
#     release_notes/v<version>.md must exist — both are checked below.
#   - Manual run from GitHub Actions UI (workflow_dispatch) — builds and tests
#     the artifacts without publishing a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the artifacts (e.g. 1.6.0-test)"
        required: false
        default: "dev"

# A re-pushed tag must not race an earlier run of the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # macOS build  (Apple Silicon / arm64 — macos-latest)
  # Produces: SetupTTS-macOS.dmg  (drag-to-Applications)
  #           SetupTTS-macOS.zip  (alternative — extract and open)
  # ────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches APP_VERSION and release notes exist
        if: github.event_name == 'push'
        run: |
          APP_VERSION="$(sed -n 's/^APP_VERSION *= *"\(.*\)"/\1/p' app/__init__.py)"
          if [ "$APP_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match APP_VERSION ${APP_VERSION}"
            exit 1
          fi
          test -f "release_notes/v${APP_VERSION}.md" \
            || { echo "::error::release_notes/v${APP_VERSION}.md is missing"; exit 1; }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest pytest-qt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build with PyInstaller
        run: python -m PyInstaller setuptts.spec --noconfirm

      - name: Verify bundle assets
        run: |
          RES=dist/SetupTTS.app/Contents/Resources
          for f in app/assets/styles/app.qss app/assets/icons/app.png app/assets/icons/chevron-down.svg; do
            test -f "$RES/$f" || { echo "::error::$f missing from bundle"; exit 1; }
          done
          test -d "$RES/edge_tts" || { echo "::error::edge_tts missing"; exit 1; }
          echo "Bundle size: $(du -sh dist/SetupTTS.app | cut -f1)"

      - name: Verify declared minimum macOS covers every bundled binary
        run: |
          python3 - <<'EOF'
          import plistlib, subprocess, pathlib, re
          app = pathlib.Path("dist/SetupTTS.app")
          declared = plistlib.loads((app / "Contents/Info.plist").read_bytes())["LSMinimumSystemVersion"]
          worst, worst_file = (0,), None
          for f in app.rglob("*"):
              if not f.is_file() or f.is_symlink():
                  continue
              with open(f, "rb") as fh:
                  if fh.read(4) not in (b"\xcf\xfa\xed\xfe", b"\xca\xfe\xba\xbe"):
                      continue
              out = subprocess.run(["otool", "-l", str(f)], capture_output=True, text=True).stdout
              for m in re.finditer(r"minos (\d+(?:\.\d+)*)", out):
                  v = tuple(int(x) for x in m.group(1).split("."))
                  if v > worst:
                      worst, worst_file = v, f
          need = ".".join(map(str, worst))
          print(f"Declared LSMinimumSystemVersion {declared}; highest bundled minos {need} ({worst_file})")
          if tuple(int(x) for x in declared.split(".")) < worst:
              raise SystemExit(f"::error::Info.plist says macOS {declared}, but {worst_file} needs {need}")
          EOF

      - name: Self-test the packaged app (version, assets, TLS, voices, synthesis)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/SetupTTS.app/Contents/MacOS/SetupTTS --selftest selftest-app.json --network \
            || { cat selftest-app.json; exit 1; }
          cat selftest-app.json
          python3 -c "import json,sys; d=json.load(open('selftest-app.json')); \
            sys.exit(0 if d['version']=='${{ steps.ver.outputs.version }}' or '${{ github.event_name }}'!='push' else 'version mismatch')"

      - name: Create DMG (drag-to-Applications layout)
        run: |
          # create-dmg exits non-zero for unsigned apps (codesign warning) even
          # when the DMG is written — the DMG is verified and tested below.
          create-dmg \
            --volname "SetupTTS" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "SetupTTS.app" 175 190 \
            --hide-extension "SetupTTS.app" \
            --app-drop-link 425 190 \
            "SetupTTS-macOS.dmg" \
            "dist/SetupTTS.app" || true
          test -f "SetupTTS-macOS.dmg" || { echo "::error::DMG was not created"; exit 1; }
          hdiutil verify "SetupTTS-macOS.dmg"
          echo "DMG size: $(du -sh SetupTTS-macOS.dmg | cut -f1)"

      - name: Self-test the app inside the DMG
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          MNT=$(mktemp -d)
          hdiutil attach "SetupTTS-macOS.dmg" -nobrowse -readonly -mountpoint "$MNT"
          "$MNT/SetupTTS.app/Contents/MacOS/SetupTTS" --selftest selftest-dmg.json \
            || { cat selftest-dmg.json; hdiutil detach "$MNT"; exit 1; }
          test -L "$MNT/Applications" || { echo "::error::Applications link missing"; exit 1; }
          hdiutil detach "$MNT"
          cat selftest-dmg.json

      - name: Create zip
        run: |
          ditto -c -k --keepParent dist/SetupTTS.app "SetupTTS-macOS.zip"
          echo "Zip size: $(du -sh SetupTTS-macOS.zip | cut -f1)"

      - name: Self-test the app extracted from the zip
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          TMP=$(mktemp -d)
          ditto -x -k "SetupTTS-macOS.zip" "$TMP"
          "$TMP/SetupTTS.app/Contents/MacOS/SetupTTS" --selftest selftest-zip.json \
            || { cat selftest-zip.json; exit 1; }
          cat selftest-zip.json
          rm -rf "$TMP"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ steps.ver.outputs.version }}
          path: SetupTTS-macOS.dmg
          if-no-files-found: error

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip-${{ steps.ver.outputs.version }}
          path: SetupTTS-macOS.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Windows build
  #
  # Two separate PyInstaller builds for two distinct use cases:
  #
  #   setuptts.spec          → onedir  → dist\SetupTTS\   (for Inno Setup installer)
  #   setuptts_portable.spec → onefile → dist_portable\SetupTTS.exe (portable zip)
  #
  # Why two builds?
  #   onedir is reliable when installed by Inno Setup (files stay together in
  #   Program Files, launched via Start Menu shortcut).  For portable use, onedir
  #   breaks because Windows Explorer lets users run EXEs from inside a zip
  #   without extracting — the _internal/ folder stays in the zip → python312.dll
  #   not found.  onefile embeds everything inside the EXE so it runs from
  #   anywhere with no folder-structure requirement.
  #
  # Every artifact is launched and self-tested: the onedir build, the app as
  # installed by the real installer, and the EXE extracted from the zip.
  #
  # Produces:
  #   SetupTTS-Windows-Installer.exe  (guided installer — recommended)
  #   SetupTTS-Windows-Portable.zip   (single EXE — extract and double-click)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches APP_VERSION
        if: github.event_name == 'push'
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/^APP_VERSION *= *"\(.*\)"/\1/p' app/__init__.py)"
          if [ "$APP_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match APP_VERSION ${APP_VERSION}"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest pytest-qt

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build installer payload (onedir)
        run: python -m PyInstaller setuptts.spec --noconfirm

      - name: Verify onedir build
        shell: pwsh
        run: |
          foreach ($f in @("dist\SetupTTS\SetupTTS.exe",
                           "dist\SetupTTS\_internal\app\assets\styles\app.qss",
                           "dist\SetupTTS\_internal\app\assets\icons\app.png",
                           "dist\SetupTTS\_internal\app\assets\icons\chevron-down.svg")) {
            if (!(Test-Path $f)) { Write-Error "$f not found"; exit 1 }
          }
          $dirSize = [math]::Round((Get-ChildItem -Recurse "dist\SetupTTS" |
            Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "onedir build: ${dirSize} MB"

      # The app is windowed (no console), so it writes results to a file; a
      # small helper runs it, waits, and fails the step on a bad result.
      - name: Write self-test helper
        shell: pwsh
        run: |
          @'
          param([string]$Exe, [string]$Out, [string]$Version, [switch]$Network)
          $argList = @("--selftest", "`"$Out`"")
          if ($Network) { $argList += "--network" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath $Exe -ArgumentList $argList -Wait -PassThru
          if (!(Test-Path $Out)) { Write-Error "no self-test output from $Exe (exit $($p.ExitCode))"; exit 1 }
          Get-Content $Out
          $r = Get-Content $Out -Raw | ConvertFrom-Json
          if (!$r.ok -or $p.ExitCode -ne 0) { Write-Error "self-test failed for $Exe"; exit 1 }
          if ($Version -and $r.version -ne $Version) { Write-Error "version $($r.version) != $Version"; exit 1 }
          '@ | Set-Content selftest.ps1

      - name: Self-test onedir build (version, assets, TLS, voices, synthesis)
        shell: pwsh
        run: |
          $ver = if ("${{ github.event_name }}" -eq "push") { "${{ steps.ver.outputs.version }}" } else { "" }
          ./selftest.ps1 -Exe "dist\SetupTTS\SetupTTS.exe" -Out "$pwd\selftest-onedir.json" -Version $ver -Network

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ver       = (Select-String -Path app\__init__.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iscc      = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $sourceDir = (Resolve-Path "dist\SetupTTS").Path
          $outputDir = (New-Item -ItemType Directory -Force -Path "installer_out").FullName

          & $iscc `
            "/DAppVersion=$ver" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            "installers\windows.iss"

          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed (exit $LASTEXITCODE)" }

          $installer = "$outputDir\SetupTTS-Windows-Installer.exe"
          if (!(Test-Path $installer)) {
            Write-Error "Installer not found: $installer"; exit 1
          }
          $size = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          Write-Host "Installer: ${size} MB"
          Copy-Item $installer "SetupTTS-Windows-Installer.exe"

      - name: Install silently and self-test the installed app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\SetupTTS-Windows-Installer.exe" `
                 -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit $($p.ExitCode)"; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\SetupTTS\SetupTTS.exe"
          if (!(Test-Path $exe)) { Write-Error "installed app not found at $exe"; exit 1 }
          $appVer = (Select-String -Path app\__init__.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $fileVer = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed EXE ProductVersion: $fileVer"
          if ($fileVer -ne $appVer) { Write-Error "EXE version info $fileVer != $appVer"; exit 1 }
          $ver = if ("${{ github.event_name }}" -eq "push") { "${{ steps.ver.outputs.version }}" } else { "" }
          ./selftest.ps1 -Exe $exe -Out "$pwd\selftest-installed.json" -Version $ver -Network

      - name: Build portable (onefile)
        run: |
          python -m PyInstaller setuptts_portable.spec --noconfirm --distpath dist_portable

      - name: Create portable zip
        shell: pwsh
        run: |
          # Zip only the single EXE — users extract and double-click SetupTTS.exe
          Compress-Archive -Force -Path "dist_portable\SetupTTS.exe" `
            -DestinationPath "SetupTTS-Windows-Portable.zip"
          $size = [math]::Round((Get-Item "SetupTTS-Windows-Portable.zip").Length / 1MB, 1)
          Write-Host "Portable zip: ${size} MB"

      - name: Self-test the EXE extracted from the portable zip
        shell: pwsh
        run: |
          $tmp = New-Item -ItemType Directory -Force -Path "$env:TEMP\st_verify"
          Expand-Archive -Path "SetupTTS-Windows-Portable.zip" -DestinationPath $tmp.FullName
          $exe = "$($tmp.FullName)\SetupTTS.exe"
          if (!(Test-Path $exe)) { Write-Error "SetupTTS.exe missing after extraction"; exit 1 }
          $ver = if ("${{ github.event_name }}" -eq "push") { "${{ steps.ver.outputs.version }}" } else { "" }
          ./selftest.ps1 -Exe $exe -Out "$pwd\selftest-portable.json" -Version $ver -Network

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.ver.outputs.version }}
          path: SetupTTS-Windows-Installer.exe
          if-no-files-found: error

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ steps.ver.outputs.version }}
          path: SetupTTS-Windows-Portable.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Publish GitHub Release (tag pushes only)
  # Attaches all four user-ready artifacts to the release
  # ────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          test -f "release_notes/${GITHUB_REF_NAME}.md" \
            || { echo "::error::release_notes/${GITHUB_REF_NAME}.md is missing"; exit 1; }

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ steps.ver.outputs.version }}
          path: .

      - name: Download macOS zip
        uses: actions/download-artifact@v4
        with:
          name: macos-zip-${{ steps.ver.outputs.version }}
          path: .

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ steps.ver.outputs.version }}
          path: .

      - name: Download Windows portable zip
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-${{ steps.ver.outputs.version }}
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SetupTTS v${{ steps.ver.outputs.version }}
          body_path: release_notes/${{ github.ref_name }}.md
          files: |
            SetupTTS-macOS.dmg
            SetupTTS-macOS.zip
            SetupTTS-Windows-Installer.exe
            SetupTTS-Windows-Portable.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
